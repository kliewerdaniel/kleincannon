<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kleincannon — vertical video generator</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo">◣</span>
      <div>
        <h1>kleincannon</h1>
        <p class="tag">self-contained vertical-video pipeline</p>
      </div>
    </div>
    <div class="services" id="services">
      <span class="dot" data-s="llm" title="LLM (gemma4, optional)">LLM</span>
      <span class="dot" data-s="comfyui" title="ComfyUI (FLUX.2-klein, auto-launched)">ComfyUI</span>
    </div>
  </header>

  <main>
    <form id="runform">
      <section class="card">
        <h2>Topic &amp; script</h2>
        <label>Topic / subject
          <input name="topic" placeholder="e.g. why a single typo kills a real-estate deal" />
        </label>
        <label>Purpose (optional, what this video is for)
          <input name="purpose" placeholder="educate / persuade / entertain — free-form, no branding logic" />
        </label>
        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" name="use_manual" checked />
            <span>Paste script (manual)</span>
          </label>
          <span class="hint">turn off to let the LLM write it</span>
        </div>
        <label id="manual-wrap">Script — one sentence per beat (newline-separated)
          <textarea name="manual_script" rows="6"
            placeholder="A single transposed number in your rent roll just lost you the deal.&#10;You didn't underwrite it wrong on purpose — you just typed a nine where the eight should be.&#10;..."></textarea>
        </label>
        <label id="beats-wrap" class="hidden">Beats (used when LLM writes it)
          <input type="number" name="beats" value="6" min="3" max="9" />
        </label>
      </section>

      <section class="card">
        <h2>Voice &amp; visuals</h2>
        <label>Voice (clip in voices/, minus extension)
          <input name="voice" value="chris" />
        </label>
        <label for="style-select">Visual style
          <select name="style" id="style-select">
            <option value="auto">auto (pick per topic)</option>
          </select>
        </label>
        <label for="steps">Sampler steps (blank = default)
          <input type="number" name="steps" id="steps" min="1" max="60" placeholder="default" />
        </label>
        <label for="cfg">CFG scale (blank = default)
          <input type="number" name="cfg" id="cfg" min="0" max="20" step="0.1" placeholder="default" />
        </label>
        <label for="seed">Image seed (blank = per-beat)
          <input type="number" name="seed" id="seed" min="0" step="1" placeholder="default" />
        </label>
        <label>Narration speed
          <input type="range" name="speed" id="speed" min="0.9" max="1.4" step="0.01" value="1.12" />
          <span id="speed-val">1.12×</span>
        </label>
        <label>Motion per beat
          <select name="motion">
            <option value="in">push-in (default)</option>
            <option value="out">pull-out</option>
            <option value="left">pan left</option>
            <option value="right">pan right</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" name="fast" /> Fast test render (low-res, few steps)
        </label>
      </section>

      <section class="card">
        <h2>Caption styling</h2>
        <label>Accent (spoken-word) colour
          <input type="color" name="caption_accent" value="#00E5FF" />
        </label>
        <label>White (upcoming-word) colour
          <input type="color" name="caption_white" value="#FFFFFF" />
        </label>
        <label>Max zoom (Ken Burns)
          <input type="number" step="0.01" name="zoom_max" value="1.14" min="1.0" max="1.6" />
        </label>
        <label>Optional CTA (free text — never auto-burned)
          <input name="cta" placeholder="leave blank unless you want it as a note" />
        </label>
      </section>

      <button type="submit" id="runbtn">▶ Generate</button>
    </form>

    <aside class="card stepper" id="stepper">
      <h2>Run progress</h2>
      <ol id="steps">
        <li data-stage="script">Script</li>
        <li data-stage="tts">Voice</li>
        <li data-stage="align">Align</li>
        <li data-stage="prompts">Image prompts</li>
        <li data-stage="images">Render</li>
        <li data-stage="captions">Captions</li>
        <li data-stage="assemble">Assemble</li>
      </ol>
      <pre id="log"></pre>
      <div id="result" class="hidden"></div>
    </aside>
  </main>

  <section class="card gallery" id="gallery">
    <h2>Episodes</h2>
    <div id="gallery-grid"></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
